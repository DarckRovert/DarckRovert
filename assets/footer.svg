<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 80" width="100%" height="80">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1224" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="neonLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#00e5ff;#8338ec;#d4af37;#00e5ff" dur="6s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="946" height="76" rx="12" fill="url(#footerBg)" stroke="#1e293b" stroke-width="1" />
  
  <!-- Glowing Neon Divider Line -->
  <line x1="100" y1="2" x2="850" y2="2" stroke="url(#neonLine)" stroke-width="2" />

  <text x="475" y="45" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-weight="600" font-size="13" fill="#94a3b8" letter-spacing="2">
    CRAFTED WITH ARCHITECTURAL DISCIPLINE • OPEN SOURCE &amp; DIGITAL SOVEREIGNTY
  </text>
  <text x="475" y="62" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#00e5ff" letter-spacing="1.5">
    DARCKROVERT // ELNAZZARENO
  </text>
</svg>
